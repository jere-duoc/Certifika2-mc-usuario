server:
  port: 8081

spring:
  application:
    name: ms-usuarios
  datasource:
    # MySQL local por defecto; en AWS las variables apuntan al endpoint privado de RDS.
    url: "jdbc:mysql://${RDS_HOSTNAME:localhost}:${RDS_PORT:3306}/${RDS_DB_NAME:certifika2_usuarios}?serverTimezone=UTC&sslMode=${RDS_SSL_MODE:PREFERRED}"
    username: ${RDS_USERNAME:root}
    password: ${RDS_PASSWORD:mysql}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_L3H9G2TFf}

cognito:
  client-id: ${COGNITO_CLIENT_ID:1rf3bts7p2klg1qvsjhqnb5o3n}

# --- Streaming de certificados (Kinesis -> generación -> S3 + Firehose) ---
certifika2:
  aws:
    region: ${AWS_REGION:us-east-1}
    # Vacío = AWS real (credenciales por DefaultCredentialsProvider / rol de la instancia).
    # http://localhost:4566 = LocalStack.
    endpoint: ${AWS_ENDPOINT:http://localhost:4566}
  kinesis:
    stream-solicitudes: ${KINESIS_STREAM_SOLICITUDES:certifika2-certificados-solicitados}
    stream-dlq: ${KINESIS_STREAM_DLQ:certifika2-certificados-dlq}
    consumer:
      enabled: ${KINESIS_CONSUMER_ENABLED:true}
      # Nombre lógico del consumidor: identifica sus checkpoints (equivalente a un consumer group).
      nombre: ${KINESIS_CONSUMER_NAME:ms-usuarios-certificados}
      poll-interval-ms: 2000
      max-records: 100
      max-intentos: 3
      backoff-inicial-ms: 500
  firehose:
    stream-emitidos: ${FIREHOSE_STREAM_EMITIDOS:certifika2-certificados-emitidos}
  s3:
    bucket-certificados: ${S3_BUCKET_CERTIFICADOS:certifika2-certificados}
