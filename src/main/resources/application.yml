server:
  port: 8081

spring:
  application:
    name: ms-usuarios
  datasource:
    # MySQL local por defecto; en AWS las variables apuntan al endpoint privado de RDS.
    url: "jdbc:mysql://${RDS_HOSTNAME:localhost}:${RDS_PORT:3306}/${RDS_DB_NAME:certifika2_usuarios}?serverTimezone=UTC&sslMode=${RDS_SSL_MODE:PREFERRED}"
    username: ${RDS_USERNAME:root}
    password: ${RDS_PASSWORD:mysql}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_L3H9G2TFf}

cognito:
  client-id: ${COGNITO_CLIENT_ID:1rf3bts7p2klg1qvsjhqnb5o3n}
